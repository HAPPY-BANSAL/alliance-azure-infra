pool: azure-agent

trigger:
- main
- feature/*

stages:
- stage: terraformplan
  jobs: 
  - job: terraformplan
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'azure-svc'
        backendAzureRmStorageAccountName: 'backendstorageaccount01'
        backendAzureRmContainerName: 'tfsttae'
        backendAzureRmKey: 'terraform.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        environmentServiceNameAzureRM: 'azure-svc'

- stage: manualapproval
  depends_On: terraformplan
  pool: server
  jobs:
  - job: manualapproval
    steps:
    - task: ManualValidation@1
      inputs:
        notifyUsers: 'admin@company.com'
        approvers: 'admin@company.com'


- stage: terraformapply
  jobs:
  - job: apply
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'azure-svc'
        backendAzureRmStorageAccountName: 'backendstorageaccount01'
        backendAzureRmContainerName: 'tfsttae'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        environmentServiceNameAzureRM: 'azure-svc'  