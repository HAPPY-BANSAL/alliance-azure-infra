pool: azure-agent

trigger:
- main
- feature/*

stages:
- stage: terraformplan
  jobs: 
  - job: terraformplan
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'azure-svc'
        backendAzureRmStorageAccountName: 'backendstorageaccount01'
        backendAzureRmContainerName: 'tfsttae'
        backendAzureRmKey: 'terraform.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        environmentServiceNameAzureRM: 'azure-svc'